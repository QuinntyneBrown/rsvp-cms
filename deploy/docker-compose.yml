# Local PostgreSQL for development, tests and e2e.
# Start with `npm run db:up`; data lives in the named volume until `docker compose down -v`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rsvp
      POSTGRES_PASSWORD: rsvp
      POSTGRES_DB: rsvp
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rsvp -d rsvp']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
